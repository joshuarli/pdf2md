[package]
name = "pdfmd"
version = "0.2.0"
edition = "2024"
description = "PDF to faithful Markdown, built on pdf_oxide"
publish = false

[lib]
name = "pdfmd"
path = "src/lib.rs"

[[bin]]
name = "pdfmd"
path = "src/main.rs"

[[bin]]
name = "pdfmd-bench"
path = "src/bin/pdfmd-bench.rs"

# pdf_oxide is the extraction engine. The other four are already in
# pdf_oxide's own dependency tree at these versions, so they add no crates
# to the build. Default features (icc colour management) are irrelevant to
# text; legacy-crypto keeps RC4/MD5-encrypted PDFs readable.
[dependencies]
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto", "rendering"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
unicode-normalization = "0.1.25"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["CFCGTypes"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["CGImageProperties", "objc2"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-image-io"] }

[profile.release]
lto = "thin"
codegen-units = 1
